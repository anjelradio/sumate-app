<!DOCTYPE html>
<html lang="es" class="h-full bg-[#f8f7fc]">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Súmate - Sin conexión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8f7fc; color: #1e293b; padding: 24px; text-align: center; }
    .card { max-width: 400px; width: 100%; background: #ffffff; border-radius: 28px; padding: 36px 24px; border: 1px solid #f1f5f9; box-shadow: 0 10px 30px -5px rgba(99, 85, 222, 0.08); }
    .icon { width: 68px; height: 68px; border-radius: 50%; background: #f1f3ff; color: #6355de; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 10px; }
    p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 28px; }
    button { background: #6355de; color: #ffffff; border: none; padding: 14px 28px; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; box-shadow: 0 8px 20px -3px rgba(99, 85, 222, 0.35); transition: opacity 0.2s; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Sin conexión a internet</h1>
    <p>Parece que has perdido la conectividad. Verifica tu conexión de datos o WiFi para continuar explorando y organizando iniciativas en Súmate.</p>
    <button onclick="window.location.reload()">Reintentar conexión</button>
  </div>
</body>
</html>
